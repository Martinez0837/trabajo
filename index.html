.tabs{display:flex;gap:8px;overflow-x:auto;padding:14px 0;position:sticky;top:0;background:var(--bg);z-index:5;scrollbar-width:thin}
.tabs button{flex:none;font:700 .9rem Calibri,"Segoe UI",Arial,sans-serif;border:1px solid var(--ln);background:var(--sf);color:var(--tx);border-radius:999px;padding:9px 16px;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected=true]{background:var(--dk);border-color:var(--dk);color:var(--on)}
button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
section{display:none}section.on{display:block}
.tool{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:4px 0 14px}
.tool span{flex:1;color:var(--mut);font-weight:700;font-size:.9rem}
.btn{font:700 .85rem Calibri,"Segoe UI",Arial,sans-serif;border:1px solid var(--dk);background:transparent;color:var(--dk);border-radius:8px;padding:8px 13px;cursor:pointer}
.btn.f{background:var(--dk);color:var(--on)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,440px),1fr));gap:14px;align-items:start}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:14px;overflow:hidden}
.card h3{margin:0;padding:11px 16px;background:var(--dk);color:var(--on);font-size:1.02rem}
.bad{padding:14px 16px;border-bottom:1px solid var(--ln)}
.wrap{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s}
.open>.wrap{grid-template-rows:1fr}.wrap>div{overflow:hidden}
.ok{margin:12px 16px 0;padding:12px 14px;background:var(--lt);border-radius:10px}
.ok b{color:var(--dk)}.ok .m{margin-top:8px;font-size:.93rem;color:var(--mut)}
.foot{padding:12px 16px}
.t{width:100%;border-collapse:separate;border-spacing:0 8px}
.t td{background:var(--sf);padding:12px 14px;vertical-align:middle;border:1px solid var(--ln)}
.t td:first-child{border-radius:10px 0 0 10px;width:44%;color:var(--gr);font-weight:700}
.t td:last-child{border-radius:0 10px 10px 0;border-left:0}
.t th{text-align:left;padding:4px 14px;color:var(--mut);font-size:.85rem}
.t .r{display:none;color:var(--dk);font-weight:700}.t tr.open .r{display:inline}.t tr.open .btn{display:none}
.steps{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px;margin:0;padding:0;list-style:none}
.steps li{background:var(--lt);border:1px solid var(--ln);border-radius:14px;padding:14px 16px 14px 62px;position:relative;min-height:84px}
.steps i{position:absolute;left:14px;top:14px;width:36px;height:36px;border-radius:50%;background:var(--dk);color:var(--on);display:grid;place-items:center;font:700 1.1rem Calibri,Arial,sans-serif}
.steps b{display:block;color:var(--dk)}
.note{margin-top:16px;padding:14px 16px;border-radius:14px;background:var(--dk);color:var(--on);font-size:.95rem}
@media (prefers-reduced-motion:reduce){.wrap{transition:none}}
</style></head><body>
<header class="hero"><div>
<h1>Procedimiento Disciplinario</h1>
<p>Guía Operativa para Coordinadores sobre el Cumplimiento Estricto del Debido Proceso (Ley 2466 de 2025 y Sentencia C-593/14)</p>
<b>Emitido por: Relaciones Laborales</b>
</div></header>
<main>
<div class="tabs" role="tablist" id="tabs"></div>
<section id="s0"><div class="tool"><span id="cnt"></span><button class="btn" id="hA">Ocultar todas</button><button class="btn f" id="sA">Mostrar todas</button></div><div class="grid" id="casos"></div></section>
<section id="s1"><table class="t"><thead><tr><th>Redacción incorrecta</th><th>Redacción recomendada</th></tr></thead><tbody id="err"></tbody></table></section>
<section id="s2"><ol class="steps" id="mod"></ol><div class="note" id="imp"></div></section>
</main>
<script>
/* EDITE AQUÍ EL CONTENIDO: casos (título, redacción errada, corrección, mejora), errores (incorrecta, recomendada) y modelo (paso, descripción). Conserve las comillas y las barras. */
const D={
 "casos": [
  [
   "Uso de expresiones ofensivas",
   "El trabajador fue grosero, irrespetuoso y trató mal a su jefe.",
   "El 15 de octubre de 2026, aproximadamente a las 10:30 a. m., durante una reunión de trabajo, el trabajador le dijo a su supervisor: «Usted no sabe hacer su trabajo».",
   "Describe la conducta y las palabras atribuidas, en lugar de utilizar calificativos generales."
  ],
  [
   "Llegadas tarde",
   "El empleado siempre llega tarde y no le importa cumplir el horario.",
   "El 19 de octubre de 2026, el trabajador ingresó a las 8:25 a. m., pese a que su hora de inicio programada era las 8:00 a. m.",
   "Elimina expresiones subjetivas como «siempre» y «no le importa»."
  ],
  [
   "Abandono del puesto",
   "El trabajador abandonó irresponsablemente su puesto de trabajo.",
   "El 20 de octubre de 2026, entre las 2:15 p. m. y las 2:45 p. m., el trabajador se ausentó de su puesto de trabajo en el área asignada.",
   "Diferencia el hecho observado de la conclusión disciplinaria."
  ],
  [
   "Incumplimiento de instrucciones",
   "El empleado es desobediente y hace lo que le da la gana.",
   "El 21 de octubre de 2026, el trabajador no finalizó el inventario de los productos asignados antes del cierre de la jornada, conforme a la instrucción recibida.",
   "Identifica la instrucción, el resultado y los aspectos que deben verificarse."
  ],
  [
   "Discusión entre compañeros",
   "El trabajador provocó una pelea porque es conflictivo y problemático.",
   "El 17 de octubre de 2026, aproximadamente a las 3:00 p. m., en el área de producción, el trabajador elevó la voz durante una discusión con un compañero y le dirigió expresiones ofensivas.",
   "Describe qué hizo o dijo cada persona, evitando calificativos y sin atribuir la responsabilidad a una sola antes de describir su participación.",
   "La frase “expresiones ofensivas” conviene reemplazarla por las palabras exactas si se conocen."
  ],
  [
   "Uso del celular",
   "El trabajador pierde el tiempo en el celular y no trabaja.",
   "El 22 de octubre de 2026, a las 11:10 a. m., el trabajador utilizó su teléfono celular personal durante aproximadamente diez minutos en su puesto de trabajo.",
   "Concreta la conducta sin afirmar que el trabajador no cumple ninguna de sus funciones."
  ],
  [
   "Incumplimiento de una tarea",
   "El empleado nunca cumple con sus obligaciones y es negligente.",
   "El trabajador no entregó dentro del plazo establecido el informe de inventario asignado para el 20 de octubre de 2026.",
   "Reemplaza generalizaciones y calificativos por información comprobable."
  ],
  [
   "Ausencia injustificada",
   "El trabajador faltó porque no quiso venir a trabajar.",
   "El 14 de octubre de 2026, el trabajador no asistió a su jornada laboral.",
   "No atribuye intenciones que no han sido demostradas."
  ]
 ],
 "errores": [
  [
   "«Es un irresponsable».",
   "«No se evidenció la entrega del informe dentro del plazo establecido»."
  ],
  [
   "«Cometió una falta gravísima».",
   "«Los hechos reportados deben analizarse para determinar su posible relevancia disciplinaria»."
  ],
  [
   "«Se niega a trabajar».",
   "«Según el reporte, no inició la actividad asignada en el momento indicado»."
  ],
  [
   "«Mintió descaradamente».",
   "«La información suministrada difiere de la registrada en el documento revisado»."
  ]
 ],
 "modelo": [
  [
   "Fecha, hora y lugar",
   "Cuándo y dónde ocurrieron los hechos."
  ],
  [
   "Descripción objetiva",
   "Qué sucedió, sin insultos, calificativos ni suposiciones."
  ],
  [
   "Fuente de información",
   "Registro, informe, documento, testimonio u otro elemento disponible."
  ],
  [
   "Circunstancias por verificar",
   "Explicaciones, autorizaciones, causas y demás elementos relevantes."
  ]
 ],
 "mal": "«El trabajador Juan es muy irresponsable, no hace caso, pierde el tiempo y siempre incumple sus funciones. Por esta razón, se le debe sancionar inmediatamente, porque su comportamiento perjudica a la empresa».",
 "bien": "«El día 21 de octubre de 2026, el supervisor del área informó que la actividad de actualización del inventario, asignada al trabajador para esa jornada, no había sido finalizada al cierre del turno. Para esclarecer la situación, se deberán revisar las instrucciones impartidas, el plazo establecido, los registros de ejecución y las posibles circunstancias que hayan incidido en el cumplimiento de la tarea. Se garantizará al trabajador la oportunidad de conocer los hechos reportados, presentar su versión y aportar las explicaciones y pruebas que considere pertinentes, de conformidad con el procedimiento y las normas aplicables».",
 "imp": "La descripción de una conducta no demuestra por sí sola que haya ocurrido ni que constituya una falta.",
 "puntos": [
  "«Se considera reincidencia cuando la persona vuelve a cometer una falta después de haber sido sancionada previamente por una conducta similar, conforme a las normas aplicables»."
 ]
};
const TAB=['1. Ejemplos de redacción de faltas','2. Errores frecuentes en documentos disciplinarios','3. Modelo recomendado para redactar un caso disciplinario'];
const $=s=>document.querySelector(s);
$('#tabs').innerHTML=TAB.map((t,i)=>`<button role="tab" aria-selected="${i==0}" data-i="${i}">${t}</button>`).join('');
$('#tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;document.querySelectorAll('.tabs button').forEach(x=>x.setAttribute('aria-selected',x==b));document.querySelectorAll('section').forEach((s,i)=>s.classList.toggle('on',i==b.dataset.i));scrollTo({top:document.querySelector('.hero').offsetHeight-10,behavior:'smooth'})};
$('#s0').classList.add('on');
$('#casos').innerHTML=D.casos.map((c,i)=>`<div class="card" data-c><h3>Caso ${i+1}. ${c[0]}</h3><div class="bad">${c[1]}</div><div class="wrap"><div><div class="ok"><b>Corrección</b><br>${c[2]}<div class="m"><b>Mejora:</b> ${c[3]}</div>${c[4]?`<div class="m"><b>Nota:</b> ${c[4]}</div>`:''}</div></div></div><div class="foot"><button class="btn" data-t>Ver corrección</button></div></div>`).join('');
$('#err').innerHTML=D.errores.map(e=>`<tr><td>${e[0]}</td><td><button class="btn" data-t>Ver recomendada</button><span class="r">${e[1]}</span></td></tr>`).join('');
$('#mod').innerHTML=D.modelo.map((m,i)=>`<li><i>${i+1}</i><b>${m[0]}</b>${m[1]}</li>`).join('');
$('#imp').innerHTML=`<b>Importante:</b> ${D.imp}<ul style="margin:10px 0 0;padding-left:20px">${(D.puntos||[]).map(t=>`<li>${t}</li>`).join('')}</ul>`;
function upd(){const n=document.querySelectorAll('#casos .open').length;$('#cnt').textContent=n+' de '+D.casos.length+' correcciones vistas'}
function set(b,show){const h=b.closest('.card,tr');h.classList.toggle('open',show);if(h.tagName!='TR')b.textContent=show?'Ocultar corrección':'Ver corrección';b.setAttribute('aria-expanded',show);upd()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-t]');if(b)set(b,!b.closest('.card,tr').classList.contains('open'))});
$('#sA').onclick=()=>document.querySelectorAll('#casos [data-t]').forEach(b=>set(b,true));
$('#hA').onclick=()=>document.querySelectorAll('#casos [data-t]').forEach(b=>set(b,false));
upd();
</script></body></html>
